name: Java CI with Maven
on:
  push:
    branches: [ main, 'feature/INT-1' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test with Maven
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springboot-test-report
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      # Build Docker image
      - name: Build Docker image
        run: docker build -t bookstore-app .
      # Run container to test
      - name: Run Docker container
        run: docker run -d -p 8088:8088 --name test-container bookstore-app
      # Stop and remove container
      - name: Stop Docker container
        run: docker stop test-container && docker rm test-container

      # Docker Compose
      - name: Build and start containers
        run: docker compose up -d --build
      - name: Wait for services
        run: sleep 30
      - name: Show container status
        run: docker compose ps
      - name: Stop containers
        if: always()
        run: docker compose down