services:
  db:
    image: postgres:15
    container_name: bookstore-db
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bookstore-app
    env_file:
      - .env
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8088/actuator/health ||
      exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

volumes:
  postgres_data: